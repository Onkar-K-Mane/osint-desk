<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="ai-label" content="{{ ai_label }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/static/js/boot.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=11">
</head>
<body {% block bodyattr %}{% endblock %} class="{{ 'rail-collapsed' if rail_collapsed else '' }}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="rail" id="rail">
      <div class="rail-top">
        <a class="wordmark" href="/" aria-label="OSINT Desk home">
          <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5M11 7.5v7M7.5 11h7"/></svg></span>
          <span class="wm-text">OSINT Desk<span class="sub">local investigations</span></span>
        </a>
        <button type="button" class="icon-btn rail-toggle" id="rail-toggle" aria-label="Collapse navigation" aria-expanded="{{ 'false' if rail_collapsed else 'true' }}" title="Collapse or expand navigation ([)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="nav" aria-label="Primary">
        <div class="nav-label" aria-hidden="true">Workspace</div>
        <a href="/" class="{{ 'active' if nav == 'investigate' else '' }}" aria-label="Investigate"{% if nav == 'investigate' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg>
          <span>Investigate</span>
        </a>
        <a href="/history" class="{{ 'active' if nav == 'history' else '' }}" aria-label="History"{% if nav == 'history' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
          <span>History</span>
        </a>
        <a href="/graph" class="{{ 'active' if nav == 'graph' else '' }}" aria-label="Graph"{% if nav == 'graph' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.2 11.2 15.6 7.2M8.2 12.8 15.6 16.8"/></svg>
          <span>Graph</span>
        </a>
        <div class="nav-label" aria-hidden="true">Configure</div>
        <a href="/providers" class="{{ 'active' if nav == 'providers' else '' }}" aria-label="Providers"{% if nav == 'providers' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M4.9 6.5l1.8 1.8M17.3 15.7l1.8 1.8M3 12h2.5M18.5 12H21M4.9 17.5l1.8-1.8M17.3 8.3l1.8-1.8"/></svg>
          <span>Providers</span>
        </a>
        <a href="/ai" class="{{ 'active' if nav == 'ai' else '' }}" aria-label="AI"{% if nav == 'ai' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14z"/></svg>
          <span>AI</span>
        </a>
        <a href="/maintain" class="{{ 'active' if nav == 'maintain' else '' }}" aria-label="Maintain"{% if nav == 'maintain' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
          <span>Maintain</span>
        </a>
      </nav>
      <div class="rail-foot">
        <a class="keys-chip" href="/providers" title="History stays on this machine. Keys never enter the database.">
          <span class="dot {{ 'ok' if keys_have >= keys_need else '' }}" aria-hidden="true"></span>
          <span>API keys set</span>
          <strong>{{ keys_have }} / {{ keys_need }}</strong>
        </a>
        <span class="ai-pill" title="Configured AI backend">{{ ai_label }}</span>
        <a href="/download.zip">Download for Colab</a>
      </div>
    </aside>
    <main class="stage" id="main">
      <div class="topbar">
        <button type="button" class="cmdk-trigger" id="cmdk-open" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="cmdk-label">Search history, jump to a page, run an action…</span>
          <span class="keys" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        </button>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="density-toggle" aria-label="Switch to compact density" aria-pressed="false" title="Density">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to light theme" title="Theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="help-open" aria-label="Keyboard shortcuts" aria-keyshortcuts="?" title="Keyboard shortcuts (?)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.4 2.4 0 1 1 3.4 2.2c-.7.4-1 .8-1 1.6M12 16.6v.1"/></svg>
          </button>
        </div>
      </div>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/app.js?v=11"></script>
  <script src="/static/js/ux.js?v=11" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
