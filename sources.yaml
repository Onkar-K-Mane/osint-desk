  ttl: { default: 1h, not_found: 1h }
  deeplink:
    hash: "https://tria.ge/s?q={value}"
  verdict:
    style: classification
  tos_note: "Hatching Triage. Hash presence in the public corpus. Key required."

- id: anyrun
  name: ANY.RUN
  types: [hash]
  mode: link_only
  tier: sandbox
  deeplink:
    hash: "https://app.any.run/submissions/#filehash:{value}"
  tos_note: "No free API. Opens their public report search."

- id: internetdb
  name: Shodan InternetDB
  types: [ip]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 12h, not_found: 2h }
  deeplink:
    ip: "https://internetdb.shodan.io/{value}"
  verdict:
    style: informational
  tos_note: "Free, no key. Port and hostname hints only — not a reputation verdict."

- id: rdap
  name: RDAP
  types: [ip, domain]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 48h, not_found: 6h }
  deeplink:
    ip: "https://rdap.org/ip/{value}"
    domain: "https://rdap.org/domain/{value}"
  verdict:
    style: informational
  tos_note: "Public RDAP. No key."

- id: hunter
  name: Hunter.io
  types: [domain, email]
  mode: api
  key_env: HUNTER_API_KEY
  limits: { per_month: 25 }
  auto_query: true
  reserve_fraction: 0.10
  tier: identity
  ttl: { default: 24h, not_found: 6h }
  deeplink:
    domain: "https://hunter.io/search/{value}"
    email: "https://hunter.io/verify/{value_urlenc}"
  verdict:
    style: informational
  tos_note: "Free tier is tiny. Domain search / email verifier. Facts only, no malware verdict."

- id: dmarc_spf
  name: DMARC / SPF
  types: [domain]
  mode: api
  auto_query: true
  tier: identity
  ttl: { default: 6h, not_found: 1h }
  deeplink:
    domain: "https://mxtoolbox.com/dmarc.aspx?domain={value}"
  verdict:
    style: informational
  tos_note: "Published DMARC policy and SPF record via Cloudflare DNS-over-HTTPS. No key."

- id: urlscan_search
  name: urlscan.io search
  types: [domain, url, ip, hash]
  mode: api
  key_env: URLSCAN_API_KEY
  limits: { per_day: 100 }
  auto_query: true
  tier: facts
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    domain: "https://urlscan.io/search/#domain:{value}"
    url: "https://urlscan.io/search/#page.url:{value_urlenc}"
    ip: "https://urlscan.io/search/#page.ip:{value}"
    hash: "https://urlscan.io/search/#hash:{value}"
  verdict:
    style: informational
  tos_note: "Search only. Submitting a new scan is a separate, explicit action (not auto)."

- id: geoasn
  name: Geo / ASN
  types: [ip]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 24h, not_found: 6h }
  deeplink:
    ip: "https://ipwho.is/{value}"
  verdict:
    style: informational
  tos_note: "ipwho.is free endpoint. Informational only."

- id: dns
  name: DNS (Cloudflare DoH)
  types: [domain]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 6h, not_found: 1h }
  deeplink:
    domain: "https://www.whatsmydns.net/#A/{value}"
  verdict:
    style: informational
  tos_note: "Resolved via Cloudflare 1.1.1.1 DNS-over-HTTPS — not against the target's NS from this machine."

- id: crtsh
  name: crt.sh
  types: [domain]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 24h, not_found: 2h }
  timeout_s: 20
  deeplink:
    domain: "https://crt.sh/?q={value}"
  verdict:
    style: informational
  tos_note: "Certificate transparency. Public, no key. Can be slow."

- id: hashlookup
  name: CIRCL hashlookup
  types: [hash]
  mode: api
  auto_query: true
  tier: facts
  ttl: { default: 24h, not_found: 2h }
  deeplink:
    hash: "https://hashlookup.circl.lu/lookup/sha256/{value}"
  verdict:
    style: allowlist
  tos_note: "Known-benign file corpus. A hit is benign; a miss is unknown, not clean."

- id: popularity
  name: Popularity allowlist
  types: [domain]
  mode: local
  auto_query: true
  tier: facts
  ttl: { default: 168h, not_found: 168h }
  verdict:
    style: allowlist
  tos_note: "Local Tranco-style top-site list. A hit is benign infrastructure, not a malware verdict."

