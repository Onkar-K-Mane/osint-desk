# OSINT Desk provider registry. Adding a source: one entry here + one small module
# (link-only sources need only this file). Keys never appear in this file.

- id: abuseipdb
  name: AbuseIPDB
  types: [ip]
  mode: api
  key_env: ABUSEIPDB_API_KEY
  limits: { per_day: 1000 }
  auto_query: true
  reserve_fraction: 0.10
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    ip: "https://www.abuseipdb.com/check/{value}"
  verdict:
    style: reputation
    malicious_at: 75
    suspicious_at: 25
  tos_note: "Free plan; personal use"

- id: virustotal
  name: VirusTotal
  types: [ip, domain, url, hash]
  mode: api
  key_env: VT_API_KEY
  limits: { per_minute: 4, per_day: 500 }
  auto_query: true
  reserve_fraction: 0.10
  tier: reputation
  ttl: { default: 1h, not_found: 1h, malicious: 24h }
  deeplink:
    ip: "https://www.virustotal.com/gui/ip-address/{value}"
    domain: "https://www.virustotal.com/gui/domain/{value}"
    hash: "https://www.virustotal.com/gui/file/{value}"
    url: "https://www.virustotal.com/gui/url/{url_sha256}"
  verdict:
    style: reputation
    malicious_at: 5
    suspicious_at: 1
  tos_note: "Public API: non-commercial use only. 4 requests/min on the free key."

- id: urlhaus
  name: URLhaus
  types: [url, domain, ip, hash]
  mode: api
  key_env: URLHAUS_API_KEY
  auto_query: true
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    url: "https://urlhaus.abuse.ch/browse.php?search={value_urlenc}"
    domain: "https://urlhaus.abuse.ch/browse.php?search={value}"
    ip: "https://urlhaus.abuse.ch/browse.php?search={value}"
    hash: "https://urlhaus.abuse.ch/browse.php?search={value}"
  verdict:
    style: reputation
    malicious_at: 1
    suspicious_at: 1
  tos_note: "abuse.ch. Free query API; Auth-Key required (free to register). No file uploads."

- id: malwarebazaar
  name: MalwareBazaar
  types: [hash]
  mode: api
  key_env: MALWAREBAZAAR_API_KEY
  auto_query: true
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    hash: "https://bazaar.abuse.ch/sample/{value}/"
  verdict:
    style: reputation
    malicious_at: 1
    suspicious_at: 1
  tos_note: "abuse.ch. Free query API; Auth-Key required (free to register)."

