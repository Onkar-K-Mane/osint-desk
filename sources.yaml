  verdict:
    style: classification
  tos_note: "Falcon Sandbox. Hash lookup only — never file uploads."

- id: triage
  name: Triage
  types: [hash]
  mode: api
  key_env: TRIAGE_API_KEY
  limits: { per_day: 200 }
  auto_query: true
