- id: greynoise_community
  name: GreyNoise Community
  types: [ip]
  mode: api
  key_env: GREYNOISE_API_KEY
  limits: { per_week: 50 }
  auto_query: false
  reserve_fraction: 0.10
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    ip: "https://viz.greynoise.io/ip/{value}"
  verdict:
    style: classification
  tos_note: "Community quota is tiny. On-demand only."

- id: ipqualityscore
  name: IPQualityScore
  types: [ip, url, email]
  mode: api
  key_env: IPQS_API_KEY
  limits: { per_day: 200 }
  auto_query: true
  reserve_fraction: 0.10
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    ip: "https://www.ipqualityscore.com/free-ip-lookup-proxy-vpn-test/lookup/{value}"
    url: "https://www.ipqualityscore.com/threat-feeds/malicious-url-scanner"
    email: "https://www.ipqualityscore.com/free-email-verification-api"
  verdict:
    style: reputation
    malicious_at: 85
    suspicious_at: 75
  tos_note: "Free key with daily cap. Fraud / proxy / email scoring."

- id: apivoid
  name: APIVoid
  types: [ip, domain, url]
  mode: api
  key_env: APIVOID_API_KEY
  limits: { per_day: 25 }
  auto_query: false
  reserve_fraction: 0.0
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    ip: "https://www.apivoid.com/tools/ip-reputation/"
    domain: "https://www.apivoid.com/tools/domain-reputation/"
    url: "https://www.apivoid.com/tools/url-reputation/"
  verdict:
    style: reputation
    malicious_at: 70
    suspicious_at: 40
  tos_note: "Opt-in. 25 free credits total, then paid — stays off until you add a key and click Run."

- id: hybrid_analysis
  name: Hybrid Analysis
  types: [hash]
  mode: api
  key_env: HYBRID_ANALYSIS_API_KEY
  limits: { per_day: 200 }
  auto_query: true
  tier: sandbox
  ttl: { default: 1h, not_found: 1h }
  deeplink:
