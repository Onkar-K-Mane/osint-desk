  name: ThreatFox
  types: [hash, ip, domain, url]
  mode: api
  key_env: THREATFOX_API_KEY
  auto_query: true
  tier: reputation
  ttl: { default: 1h, not_found: 1h }
  deeplink:
    hash: "https://threatfox.abuse.ch/browse.php?search=ioc:{value}"
    ip: "https://threatfox.abuse.ch/browse.php?search=ioc:{value}"
    domain: "https://threatfox.abuse.ch/browse.php?search=ioc:{value}"
    url: "https://threatfox.abuse.ch/browse.php?search=ioc:{value_urlenc}"
  verdict:
    style: reputation
    malicious_at: 1
